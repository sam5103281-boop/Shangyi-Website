name: Deploy Website to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Verify build output
        run: |
          echo "== dist =="
          ls -la dist || (echo "dist/ missing — build failed"; exit 1)
          echo "== dist/server =="
          ls -la dist/server || (echo "dist/server missing — build did not produce Nitro output"; exit 1)

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)

      - name: Wrangler whoami (check which account this token belongs to)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx --bun wrangler@4.110.0 whoami

      # Build a clean deployment config instead of letting Wrangler consume
      # Nitro's generated redirect config from .wrangler/deploy/config.json.
      - name: Create explicit Worker deployment config
        run: |
          python3 - <<'PY'
          import json, pathlib
          source = pathlib.Path("dist/server/wrangler.json")
          cfg = json.loads(source.read_text())
          cfg["name"] = "shangyi-web"
          cfg["workers_dev"] = True
          cfg.pop("dry_run", None)
          cfg.pop("pages_build_output_dir", None)

          # Resolve all paths relative to the repository root because this
          # config is intentionally written there, outside Nitro's redirect.
          cfg["main"] = "dist/server/" + pathlib.Path(cfg.get("main", "index.mjs")).name
          assets = cfg.get("assets")
          if isinstance(assets, dict):
              assets["directory"] = "dist/client"

          target = pathlib.Path("wrangler.deploy.json")
          target.write_text(json.dumps(cfg, indent=2))
          print("Deployment config:")
          print(target.read_text())
          PY

          test -f dist/server/index.mjs || (echo "Worker entry missing"; exit 1)
          test -d dist/client || (echo "Client assets missing"; exit 1)

      # Run Wrangler directly so deployment failures retain Cloudflare's full
      # diagnostic output instead of being reduced to an opaque npx exit code.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          bunx --bun wrangler@4.110.0 deploy \
            --config wrangler.deploy.json \
            --name shangyi-web 2>&1 | tee /tmp/wrangler-deploy.log

          grep -Eq "(Uploaded|Deployed|Current Version ID)" /tmp/wrangler-deploy.log || {
            echo "ERROR: Wrangler exited without uploading a Worker."
            exit 1
          }

      # Query the account API directly. A Wrangler exit code alone is not
      # sufficient proof that the Worker exists in the expected account.
      - name: Verify Worker in the expected Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          bunx --bun wrangler@4.110.0 deployments list \
            --config wrangler.deploy.json \
            --name shangyi-web

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/cloudflare-workers.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")

          python3 - "$HTTP_STATUS" <<'PY'
          import json, pathlib, sys

          status = sys.argv[1]
          payload = json.loads(pathlib.Path("/tmp/cloudflare-workers.json").read_text())
          if status != "200" or not payload.get("success"):
              print("Cloudflare API verification failed:", status)
              print(payload.get("errors", []))
              raise SystemExit(1)

          names = sorted(item.get("id", "") for item in payload.get("result", []))
          print("Workers visible in the configured account:", names or "(none)")
          if "shangyi-web" not in names:
              print("ERROR: shangyi-web was not created in CLOUDFLARE_ACCOUNT_ID.")
              raise SystemExit(1)
          PY

          echo "=============================================="
          echo "API verified Worker: shangyi-web"
          echo "Live URL: https://shangyi-web.sam5103281.workers.dev"
          echo "=============================================="
