name: Deploy Website to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Verify build output
        run: |
          echo "== dist =="
          ls -la dist || (echo "dist/ missing — build failed"; exit 1)
          echo "== dist/server =="
          ls -la dist/server || (echo "dist/server missing — build did not produce Nitro output"; exit 1)

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail
          npx --yes wrangler@4.110.0 deploy --config wrangler.jsonc 2>&1 | tee /tmp/wrangler-deploy.log
          grep -Eq "(Uploaded|Deployed|Current Version ID)" /tmp/wrangler-deploy.log || {
            echo "ERROR: Wrangler did not upload shangyi-web."
            exit 1
          }

      - name: Verify Worker in the expected Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4.110.0 deployments list --name shangyi-web
          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/cloudflare-workers.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")

          python3 - "$HTTP_STATUS" <<'PY'
          import json, pathlib, sys

          status = sys.argv[1]
          payload = json.loads(pathlib.Path("/tmp/cloudflare-workers.json").read_text())
          if status != "200" or not payload.get("success"):
              print("Cloudflare API verification failed:", status)
              print(payload.get("errors", []))
              raise SystemExit(1)

          names = sorted(item.get("id", "") for item in payload.get("result", []))
          print("Workers visible in the configured account:", names or "(none)")
          if "shangyi-web" not in names:
              print("ERROR: shangyi-web was not created in CLOUDFLARE_ACCOUNT_ID.")
              raise SystemExit(1)
          PY

          echo "=============================================="
          echo "API verified Worker: shangyi-web"
          echo "Live URL: https://shangyi-web.sam5103281.workers.dev"
          echo "=============================================="
