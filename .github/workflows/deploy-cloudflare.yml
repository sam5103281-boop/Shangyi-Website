name: Deploy Website to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Verify build output
        run: |
          echo "== dist =="
          ls -la dist || (echo "dist/ missing — build failed"; exit 1)
          echo "== dist/server =="
          ls -la dist/server || (echo "dist/server missing — build did not produce Nitro output"; exit 1)

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)

      - name: Wrangler whoami (check which account this token belongs to)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx --bun wrangler@4.110.0 whoami

      # Override the auto-generated Worker name (Nitro picks a random
      # "adjective-noun-noun" when package.json name is invalid for Workers).
      # Also force workers_dev=true so the *.workers.dev preview URL works.
      - name: Pin Worker name and enable workers.dev
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("dist/server/wrangler.json")
          cfg = json.loads(p.read_text())
          cfg["name"] = "shangyi-web"
          cfg["workers_dev"] = True
          p.write_text(json.dumps(cfg, indent=2))
          print("Worker name:", cfg["name"])
          print("workers_dev:", cfg["workers_dev"])
          PY

      # Run Wrangler directly so deployment failures retain Cloudflare's full
      # diagnostic output instead of being reduced to an opaque npx exit code.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          bunx --bun wrangler@4.110.0 deploy \
            --config dist/server/wrangler.json \
            --name shangyi-web

      # Do not treat a successful command as a successful website deployment:
      # this must be able to read the named Worker back from Cloudflare.
      - name: Verify deployed Worker exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          bunx --bun wrangler@4.110.0 deployments list \
            --config dist/server/wrangler.json \
            --name shangyi-web
          echo "=============================================="
          echo "Verified Worker: shangyi-web"
          echo "Live URL: https://shangyi-web.sam5103281.workers.dev"
          echo "=============================================="
