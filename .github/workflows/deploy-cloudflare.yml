name: Deploy Website to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Verify build output
        run: |
          echo "== dist =="
          ls -la dist || (echo "dist/ missing — build failed"; exit 1)
          echo "== dist/server =="
          ls -la dist/server || (echo "dist/server missing — build did not produce Nitro output"; exit 1)

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)

      - name: Wrangler whoami (check which account this token belongs to)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx --bun wrangler@4.110.0 whoami

      # Run Wrangler directly so deployment failures retain Cloudflare's full
      # diagnostic output instead of being reduced to an opaque npx exit code.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: bunx --bun wrangler@4.110.0 deploy --config dist/server/wrangler.json

      - name: Show deployed Worker URL
        run: |
          echo "=============================================="
          echo "Worker name (from wrangler.json):"
          grep -E '"name"' dist/server/wrangler.json | head -1
          echo ""
          echo "Expected URL pattern:"
          echo "  https://<worker-name>.<your-subdomain>.workers.dev"
          echo ""
          echo "Find your subdomain at:"
          echo "  Cloudflare Dashboard → Workers & Pages → right sidebar 'Subdomain'"
          echo "=============================================="
